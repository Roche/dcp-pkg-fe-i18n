# must be unique in a given SonarQube instance
sonar.projectKey=DCP_FE_PACKAGE_I18N

# --- optional properties ---
sonar.qualitygate.timeout=900

sonar.coverage.exclusions=**/*.*

# exclude some files and folders
sonar.exclusions=node_modules/**

# defaults to project key
sonar.projectVersion=2.2.0

# Path is relative to the sonar-project.properties file. Defaults to .
#sonar.sources=.

# Encoding of the source code. Default is default system encoding
#sonar.sourceEncoding=UTF-8

# Ignore a few rules
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6

# Field names should comply with a naming convention
sonar.issue.ignore.multicriteria.e1.ruleKey=Web:InternationalizationCheck
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.html

# Field names should comply with a naming convention
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:IllegalAttributeCheck
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.html

# Variable names should comply with a naming convention
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S2201
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.ts

# Variable names should comply with a naming convention
sonar.issue.ignore.multicriteria.e4.ruleKey=typescript:S4325
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*.ts

# Variable names should comply with a naming convention
sonar.issue.ignore.multicriteria.e5.ruleKey=typescript:S109
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.ts

# Variable names should comply with a naming convention
sonar.issue.ignore.multicriteria.e5.ruleKey=javascript:S139
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*.js

# Vue composables return false positive for cognitive complexity
sonar.issue.ignore.multicriteria.e6.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e6.resourceKey=**/use*.ts
